<div id=u>
  <h1>nanosteg</h1>
  <div id=x>
    <button id=hb>Hide</button>
    <button id=sb class=n>Reveal</button>
  </div>
  <div id=ht>
    <input id=m placeholder=Secret >
    <input id=c maxlength=8 placeholder=Carrier >
    <button id=h>Hide</button>
  </div>
  <div id=st hidden>
    <input id=l placeholder=Paste >
    <button id=s>Show</button>
  </div>
  <input id=o placeholder=Output >
  <button id=p>Copy</button>
  <button id=r>Clear</button>
  <style>
    * {
      outline: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      font-size: 1rem;
      height: 100vh;
      display: grid;
      place-items: center
    }
    #u {
      width: 300px;
      display: grid;
      gap: 10px;
      background: #444;
      padding: 10px;
      place-items: center;
      opacity: .9
    }
    canvas{
      position:fixed;
      inset:0;
      pointer-events: none
    }
    input,
    button {
      background: #222;
      color: #fff;
      width: 100%;
      padding: 6px 8px;
      border: 2px #222 solid;
      font: inherit
    }
    button:active {
      filter: brightness(1.3);
    }
    input {
      background: gray;
      border-color: #222
    }
    #x {
      display: flex;
    }
    #hb,
    #sb {
      background: #000;
    }
    div {
      gap: 10px;
      width: 100%
    }
    .n {
      opacity: .5;
    }
  </style>
  <script>
    BC = document.createElement('canvas')
    bcw = BC.width = 200
    BC.height = 1
    BC.style.cssText = 'filter:saturate(0);opacity:.17;position:fixed;inset:0;z-index:-1;width:100%;height:100%'
    u.before(BC)
    BX = BC.getContext('2d')
    BD = BX.createImageData(bcw, 1)
    D = BD.data
    t = 0
    ;(function f(){
      t += .03
      for (let X = 0; X < bcw; X++) {
        const v = Math.sin(X / 9 + t)
                + Math.sin(-t)
                + Math.sin(X / 12 + t)
                + Math.sin(Math.hypot(X - 80, 45) / 6 - t * 2)
        const i = X * 4
        D[i] = 128 + 127 * Math.sin(v * Math.PI)
        D[i + 1] = 128 + 127 * Math.sin(v * Math.PI + 2)
        D[i + 2] = 128 + 127 * Math.sin(v * Math.PI + 4)
        D[i + 3] = 255
      }
      BX.putImageData(BD, 0, 0)
      requestAnimationFrame(f)
    })()

    q = () => (m.value = c.value = l.value = o.value = "")

    //Confetti engine logic
    R = Math.random
    C = document.createElement('canvas')
    u.append(C)
    X=C.getContext('2d')
    P = []
    W=C.width=innerWidth
    H=C.height=innerHeight
    onresize =_=>{W=C.width=innerWidth;H=C.height=innerHeight}
    B=(x,y)=>{for(let i=30;i--;)P.push([x+R()*30-15,y+R()*30-15,R()*10-5,R()*-10-3,R()*2+1,R()*360,1])}
    setInterval(_=>{
      if(!P.length) return 
      X.clearRect(0,0,W,H)
      for(let i = P.length; i--;){
        let p=P[i]
        p[0]+=p[2]
        p[1]+=p[3]
        p[3]+=.4
        p[2]*=.98
        p[6]-=.02
        if(p[6]<0||p[1]>H+30){
          P.splice(i,1)
          continue
        }
        X.globalAlpha=p[6]
        X.fillStyle=`hsl(${p[5]},90%,60%)`
        X.fillRect(p[0],p[1],p[4],p[4]*2)
      }
    }, 17)

    let a,z,g
    u.onclick = e=>{
      const t = e.target.tagName[0]
      const f = t=='B' ? 300 : t == 'I' ? 200 : 0
      f && (a = a || new AudioContext,
      z = a.createOscillator(),
      g = a.createGain(),
      z.frequency.value = f,
      z.connect(g).connect(a.destination),
        g.gain.setValueAtTime(.08, a.currentTime),
        g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5),
        z.start(),
        z.stop(a.currentTime + .5))
      'hsp'.includes(e.target.id) && B(e.clientX, e.clientY)
    }


    // tabHBtn.onclick = () => {
    //   st.hidden = true
    //   ht.hidden = false
    //   hb.classList.remove('n')
    //   sb.classList.add('n')
    //   d.getElementById('o').value = ""
    //   q()
    // }
    // tabSBtn.onclick = () => {
    //   ht.hidden = true
    //   st.hidden = false
    //   sb.classList.remove('n')
    //   hb.classList.add('n')
    //   d.getElementById('o').value = ""
    //   q()
    // }
    // This is me (rino) writing this comment again, minifying it here too, with listener on parent
    x.onclick = (e) => {
      const hide = e.target == hb
      ht.hidden = !hide
      st.hidden = hide
      hb.className = hide ? "" : "n"
      sb.className = hide ? "n" : ""
      q()
    }

    encoder = new TextEncoder()
    decoder = new TextDecoder()

    /** 
      WRITTEN BY ME! NOT AN AGENT:
      for anyone refering the code
      this is the logic of this algorithm.
      unicode characters from 0xFF00 to 0xFE0F are 16 chars
      characters from 0xE0100 to 0xE01EF are 240 chars
      which means there are 256 characters,
      and the crazy part is that these are invisible too
      this function basically converts the secret text to
      these characters and then append them to the carrier
    **/
    const hidetext = (c, s) => {
      let n = ""
      for (const b of encoder.encode(s))
        n += String.fromCodePoint(b < 16 ? 0xfe00 + b : 0xe00f0 + b)
      return c + n
    }

    const showtext = (t) => {
      let bytes = []
      for (const char of t) {
        const code = char.codePointAt(0)
        let val = -1

        if (code >= 0xfe00 && code < 0xfe10) val = code - 0xfe00
        else if (code >= 0xe0100 && code <= 0xe01ef) val = code - 0xe0100 + 16

        if (val < 0) {
          if (bytes.length) break
          continue
        }
        bytes.push(val)
      }
      return decoder.decode(new Uint8Array(bytes))
    }

    h.onclick = () => (o.value = hidetext(c.value, m.value))
    s.onclick = () => (o.value = showtext(l.value))
    p.onclick = () => navigator.clipboard.writeText(o.value)
    r.onclick = q
  </script>
</div>
